
{% extends "base.html" %}

{% block title %}Delete Product | InventoryMS{% endblock %}

{% block content %}

<div class="mb-4">
    <a href="{% url 'product_list' %}"
       class="text-decoration-none text-secondary">← Back to Products</a>
</div>

<div class="card border-0 mx-auto" style="max-width: 600px;">
    <div class="card-body-custom text-center py-5">
        <div class="display-5 mb-3">⚠️</div>

        <h1 class="page-heading">Delete Product?</h1>

        <p class="text-secondary mt-3">
            Are you sure you want to delete
            <strong>{{ product.name }}</strong>?
            This action cannot be undone.
        </p>

        <form method="POST" class="mt-4">
            {% csrf_token %}

            <div class="d-flex justify-content-center flex-wrap gap-2">
                <button type="submit" class="btn btn-danger px-4">
                    Confirm Delete
                </button>

                <a href="{% url 'product_list' %}"
                   class="btn btn-outline-secondary px-4">Cancel</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
