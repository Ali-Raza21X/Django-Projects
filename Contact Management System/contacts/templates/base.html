{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Contact Management System{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'contacts/css/style.css' %}">
</head>
<body>

    <nav class="navbar navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'contact_list' %}">
                Contact Manager
            </a>

            <a href="{% url 'create_contact' %}" class="btn btn-light btn-sm">
                + Add Contact
            </a>
        </div>
    </nav>

    <main class="container main-content py-4">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center py-3 border-top bg-white">
        <small>&copy; 2026 Contact Management System</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
