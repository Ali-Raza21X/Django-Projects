{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="todo-container">

        <h1>Update Task</h1>
        <p class="subtitle">Edit your task details below.</p>

        <div class="task-form">
            <form method="post">
                {% csrf_token %}

                {{ form.as_p }}

                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-update">
                        Save Changes
                    </button>

                    <a href="{% url 'home' %}" class="btn btn-cancel">
                        Cancel
                    </a>
                </div>
            </form>
        </div>

    </div>
</div>
{% endblock %}
