{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="todo-container text-center">

        <h1>Delete Task?</h1>
        <p class="subtitle">Are you sure you want to delete this task?</p>

        <div class="task-item text-start mb-4">
            <div class="task-info">
                <h5>{{ task.title }}</h5>
                <p>{{ task.description }}</p>
                <span class="task-status">{{ task.status }}</span>
            </div>
        </div>

        <form method="post">
            {% csrf_token %}

            <button type="submit" class="btn btn-delete">
                Yes, Delete
            </button>

            <a href="{% url 'home' %}" class="btn btn-cancel">
                Cancel
            </a>
        </form>

    </div>
</div>
{% endblock %}
