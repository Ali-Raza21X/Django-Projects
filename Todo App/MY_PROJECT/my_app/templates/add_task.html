{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="todo-container">

        <h1>Add a Task</h1>
        <p class="subtitle">What do you need to get done?</p>

        <div class="task-form">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}

                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-add">
                        Add Task
                    </button>

                    <a href="{% url 'home' %}" class="btn btn-cancel">
                        Cancel
                    </a>
                </div>
            </form>
        </div>

    </div>
</div>
{% endblock %}
